# Runs R CMD check, which runs tests/tinytest.R, which runs the whole tinytest
# suite. Without this, nothing exercises the package automatically: the
# snafun::plot() regression of April 2026 survived three months because the only
# in-package callers of it sit inside \dontrun{} and nobody ran the checks.
#
# Adapted from https://github.com/r-lib/actions/tree/v2/examples

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # snafun depends on spatialreg/spdep, which pull in sf and therefore GDAL,
      # GEOS and PROJ. setup-r-dependencies resolves those system requirements.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # Guard against forgotten exports (the class of bug that hid the
      # snafun::plot() regression). The audit parses R/*.R against NAMESPACE, so
      # it must run on the source tree, not on the installed package -- which is
      # why it is a workflow step rather than a tinytest test. Run once, on the
      # ubuntu-release job, reusing the dependencies already installed above so
      # the roxygen drift check can load the package. Exits non-zero on a hard
      # problem, failing the job.
      - name: Audit exports
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        run: |
          Rscript -e 'if (!requireNamespace("roxygen2", quietly = TRUE)) install.packages("roxygen2")'
          Rscript tools/audit-exports.R
        shell: bash
